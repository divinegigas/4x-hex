name: tests

on:
  push:
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --headless --version

      - name: Import project
        run: |
          godot --headless --import 2>&1 | tee import.log
          ! grep -q "SCRIPT ERROR" import.log

      - name: Run tests
        run: godot --headless --script res://tests/run_tests.gd

      - name: Smoke-run the main scene
        run: |
          godot --headless --quit-after 120 2>&1 | tee run.log
          ! grep -qE "SCRIPT ERROR|ERROR:" run.log
